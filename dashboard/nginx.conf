server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Audit 4.6: security headers. SSE/SSE-JS and browser OTLP need
    # 'connect-src' to include /api/ and /otel/ (same origin).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS is only meaningful when TLS terminates at this nginx. When caddy is
    # in front doing TLS, the header is still emitted but harmless on plain
    # HTTP inside the bridge network.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health probe for k8s / healer — returns 200 without touching disk.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests to backend
    # Docker internal DNS resolver + variable forces re-resolution on every request
    # Prevents 502s after API container recreation (stale IP cache)
    resolver 127.0.0.11 valid=5s;
    set $api_backend zovark-api;
    location /api/ {
        proxy_pass http://$api_backend:8090$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Browser OTLP → SigNoz (Ticket 10). Same-origin /otel/* avoids CORS to :4318.
    set $signoz_otel zovark-signoz-collector;
    location /otel/ {
        proxy_pass http://$signoz_otel:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
