# ============================================================
# ZOVARK Helm Chart — Default Values
# ============================================================

global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  namespace: zovark

# ─── API Gateway ──────────────────────────────────────────
api:
  replicaCount: 2
  image:
    repository: ghcr.io/zovark-soc/zovark-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    PORT: "8090"
    TEMPORAL_ADDRESS: "temporal:7233"

# ─── Worker ───────────────────────────────────────────────
worker:
  replicaCount: 2
  image:
    repository: ghcr.io/zovark-soc/zovark-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    TEMPORAL_ADDRESS: "temporal:7233"
    LITELLM_URL: "http://litellm:4000/v1/chat/completions"
    REDIS_URL: "redis://redis:6379/0"
    ZOVARK_LLM_MODEL: "fast"
    PYTHONUNBUFFERED: "1"

# ─── Dashboard ────────────────────────────────────────────
dashboard:
  replicaCount: 1
  image:
    repository: ghcr.io/zovark-soc/zovark-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ─── PostgreSQL ───────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: zovark
    # REQUIRED — pass via `helm install --set postgresql.auth.password=<value>`
    # or a secrets-management integration (Sealed Secrets, External Secrets Operator).
    # Chart templates use `required` helper to fail render if empty.
    password: ""
    database: zovark
  primary:
    persistence:
      size: 20Gi

# ─── Redis ────────────────────────────────────────────────
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi
    resources:
      limits:
        memory: 256Mi

# ─── Temporal ─────────────────────────────────────────────
temporal:
  enabled: true
  address: "temporal:7233"

# ─── LiteLLM ─────────────────────────────────────────────
litellm:
  enabled: true
  # REQUIRED — pass via `helm install --set litellm.masterKey=<value>`
  masterKey: ""

# ─── Ingress ─────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: zovark.local
      paths:
        - path: /api
          pathType: Prefix
          service: api
          port: 8090
        - path: /
          pathType: Prefix
          service: dashboard
          port: 3000
  tls: []
    # - secretName: zovark-tls
    #   hosts:
    #     - zovark.local

# ─── Secrets ─────────────────────────────────────────────
# ALL keys below are REQUIRED at install time. The chart templates wrap every
# reference with Helm's `required` helper so `helm install` / `helm template`
# fails with a readable error naming each missing value. Pass via:
#   helm install zovark helm/zovarc/ \
#     --set secrets.databaseUrl=postgresql://... \
#     --set secrets.jwtSecret=$(openssl rand -base64 64) \
#     --set secrets.litellmMasterKey=sk-... \
#     --set secrets.redisUrl=redis://...
# Or use a values override file not checked into git.
secrets:
  databaseUrl: ""
  jwtSecret: ""
  litellmMasterKey: ""
  redisUrl: ""

# ─── Integration Secrets (optional) ──────────────────────
integrations:
  slack:
    webhookUrl: ""
  jira:
    url: ""
    email: ""
    apiToken: ""
  teams:
    webhookUrl: ""
  email:
    smtpHost: ""
    smtpPort: "587"
    smtpUser: ""
    smtpPassword: ""
  servicenow:
    instance: ""
    user: ""
    password: ""
