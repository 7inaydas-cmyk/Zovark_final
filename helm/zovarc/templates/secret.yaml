apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zovark.fullname" . }}-secrets
  labels:
    {{- include "zovark.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required — pass via --set secrets.databaseUrl=postgresql://..." .Values.secrets.databaseUrl | quote }}
  jwt-secret: {{ required "secrets.jwtSecret is required — generate with: openssl rand -base64 64" .Values.secrets.jwtSecret | quote }}
  litellm-master-key: {{ required "secrets.litellmMasterKey is required" .Values.secrets.litellmMasterKey | quote }}
  redis-url: {{ required "secrets.redisUrl is required — pass via --set secrets.redisUrl=redis://..." .Values.secrets.redisUrl | quote }}
  {{- if .Values.integrations.slack.webhookUrl }}
  slack-webhook-url: {{ .Values.integrations.slack.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.integrations.teams.webhookUrl }}
  teams-webhook-url: {{ .Values.integrations.teams.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.integrations.jira.apiToken }}
  jira-api-token: {{ .Values.integrations.jira.apiToken | quote }}
  {{- end }}
  {{- if .Values.integrations.email.smtpPassword }}
  smtp-password: {{ .Values.integrations.email.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.integrations.servicenow.password }}
  snow-password: {{ .Values.integrations.servicenow.password | quote }}
  {{- end }}
